name: lincefood_app
description: Base Flutter para la app de cafetería Lincefood.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_database: ^13.1.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^22.2.0
  cloud_functions: 7.1.0
  flutter_stripe: 15.0.0
  firebase_storage: ^14.1.0
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3
  local_auth: ^3.0.2
  google_maps_flutter: ^2.19.0
  geolocator: ^14.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  flutter_cache_manager: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file: ^7.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/notifications/notificaciones.seed.json
    - assets/images/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
