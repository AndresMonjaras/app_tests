name: lincefood_app
description: Base Flutter para la app de cafetería Lincefood.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_app_check: ^0.5.1
  firebase_database: ^13.1.0
  firebase_storage: ^14.1.0
  firebase_messaging: ^17.0.1
  cloud_functions: ^7.1.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.3
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
